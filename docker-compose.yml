# Docker Compose file (version omitted)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: datalogger:latest
    container_name: datalogger_web
    restart: always
    network_mode: "host"
    privileged: true
    command: ["python", "backend/app.py"]
    env_file:
      - .env
    # devices:
    volumes:
      - ./backend/db_manager/data:/app/backend/db_manager/data
      - /dev/shm:/dev/shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  polling:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: datalogger:latest
    container_name: datalogger_polling
    restart: always
    network_mode: "host"
    privileged: true
    command: ["python", "backend/scripts/run_polling.py"]
    env_file:
      - .env
    # devices:
    volumes:
      - ./backend/db_manager/data:/app/backend/db_manager/data
      - /dev/shm:/dev/shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - web

  uploader:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: datalogger:latest
    container_name: datalogger_uploader
    restart: always
    network_mode: "host"
    command: ["python", "backend/scripts/run_uploader.py"]
    env_file:
      - .env
    volumes:
      - ./backend/db_manager/data:/app/backend/db_manager/data
      - /dev/shm:/dev/shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - web

